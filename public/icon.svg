<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1e"/>
      <stop offset="50%" stop-color="#070914"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="magmaGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="40%" stop-color="#ec4899"/>
      <stop offset="80%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="103" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Pulse Rings (Seismic waves) -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="#00f0ff" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="220" r="180" fill="none" stroke="#8b5cf6" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Volcano Outer Cone -->
  <path d="M120 400 L216 230 L296 230 L392 400 Z" fill="url(#mountainGrad)" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>

  <!-- Caldera Plume Glow -->
  <ellipse cx="256" cy="230" rx="42" ry="14" fill="#00f0ff" opacity="0.3" filter="url(#glow)"/>
  <ellipse cx="256" cy="230" rx="32" ry="9" fill="url(#magmaGlow)"/>

  <!-- Eruption Beam / Signal Energy -->
  <path d="M256 220 L256 120" stroke="url(#cyanNeon)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="256" cy="116" r="8" fill="#00f0ff" filter="url(#glow)"/>
  
  <!-- Lava flow fissures (neon cyan and violet) -->
  <path d="M236 238 Q220 280 230 330 Q236 360 220 400" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M276 238 Q290 290 280 340 Q272 370 290 400" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Base Grid / Contour Lines -->
  <path d="M140 370 Q256 385 372 370" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M164 340 Q256 352 348 340" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Radar sweep arc -->
  <path d="M210 180 A50 50 0 0 1 302 180" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M190 156 A76 76 0 0 1 322 156" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>
